name: Build LOKI APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses > /dev/null || true

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - name: Download offline wake-word model
        run: |
          curl -L -o model.zip https://alphacephei.com/vosk/models/vosk-model-small-en-in-0.4.zip
          unzip -q model.zip
          mkdir -p app/src/main/assets/vosk-model
          cp -r vosk-model-small-en-in-0.4/* app/src/main/assets/vosk-model/
          ls app/src/main/assets/vosk-model

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: LOKI-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
